<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCHA INFRAMUNDO | Championships</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .championship-card {
            background: #1a1a1a;
            border: 2px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
        }

        .championship-card:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .championship-image {
            height: 250px;
            background: linear-gradient(135deg, #333 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ffd700;
            position: relative;
            overflow: hidden;
        }

        .championship-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .championship-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffd700;
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .championship-body {
            padding: 1.5rem;
            color: #fff;
        }

        .championship-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 0.5rem;
        }

        .championship-description {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .current-champion {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid #ffd700;
            padding: 0.75rem;
            margin-top: 1rem;
            border-radius: 4px;
        }

        .current-champion label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            font-weight: 700;
        }

        .current-champion .champion-name {
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: 900;
        }

        .days-held {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.5rem;
        }

        .history-btn {
            margin-top: 1rem;
            width: 100%;
            background: #ffd700;
            color: #000;
            border: none;
            padding: 0.6rem;
            font-weight: 700;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .history-btn:hover {
            background: #ffed4e;
            transform: scale(1.02);
        }

        .modal-body {
            background: #1a1a1a;
            color: #fff;
        }

        .history-table {
            color: #fff;
        }

        .history-table thead {
            background: #ffd700;
            color: #000;
        }

        .history-table tbody tr {
            border-bottom: 1px solid #333;
        }

        .history-table tbody tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        .reign-note {
            font-size: 0.85rem;
            color: #aaa;
            font-style: italic;
        }

        .no-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #222 0%, #000 100%);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">LUCHA INFRAMUNDO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Roster</a></li>
                    <li class="nav-item"><a class="nav-link" href="results.html">Results</a></li>
                    <li class="nav-item"><a class="nav-link active" href="championships.html">Championships</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="py-5 text-center text-white bg-dark header-banner">
        <div class="container">
            <h1 class="display-4 fw-black">CHAMPIONSHIPS</h1>
            <p class="lead">Glory, Dominance, and the Path to Greatness</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="mb-4 border-bottom pb-3">
            <h2 class="section-title mb-0">Titles of Lucha Inframundo</h2>
        </div>

        <div id="championships-grid" class="row g-4">
            <!-- Championships will be injected here -->
        </div>
    </main>

    <!-- History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-0">
                <div class="modal-header bg-dark text-white rounded-0">
                    <h5 class="modal-title" id="historyModalLabel">Championship History</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="p-4">
                        <div id="history-content">
                            <!-- History table will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-dark text-white text-center mt-5">
        <p class="small mb-0">&copy; 2026 LUCHA INFRAMUNDO. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/lucha_inframundo_site_championships.js"></script>
</body>
</html>
