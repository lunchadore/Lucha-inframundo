<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCHA INFRAMUNDO | Professional Wrestling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">LUCHA INFRAMUNDO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Roster</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Results</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Championships</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="py-5 text-center text-white bg-dark header-banner">
        <div class="container">
            <h1 class="display-4 fw-black">OFFICIAL ROSTER</h1>
            <p class="lead">The Warriors of the Underworld</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="section-title mb-0">Active Competitors</h2>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-dark btn-sm" onclick="filterRoster('All')">ALL</button>
                <button type="button" class="btn btn-outline-dark btn-sm" onclick="filterRoster('Main Roster')">MAIN</button>
            </div>
        </div>

        <div id="roster-grid" class="row">
            <!-- JavaScript will inject cards here -->
        </div>
    </main>

    <!-- Bio Modal -->
    <div class="modal fade" id="bioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-0">
                <div class="modal-header bg-dark text-white rounded-0">
                    <h5 class="modal-title" id="modalNameLabel">ATHLETE PROFILE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" id="modal-body-container">
                    <!-- JS fills this -->
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-dark text-white text-center mt-5">
        <p class="small mb-0">&copy; 2026 LUCHA INFRAMUNDO. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/lucha_inframundo_site_js_script.js"></script>
</body>
</html>
